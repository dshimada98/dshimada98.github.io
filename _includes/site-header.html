<header class="site-header">
  <div class="header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">Daisuke Shimada</a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/work-experience/' | relative_url }}"{% if page.url == '/work-experience/' %} aria-current="page"{% endif %}>Work experience</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle hidden aria-label="Switch to dark theme" aria-pressed="false">
      <span data-theme-label>Dark theme</span>
    </button>
  </div>
</header>
